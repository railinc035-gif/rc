<!DOCTYPE html>
<html lang="es"><head>




<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Framen Browser</title>
<style>
:root {
  color-scheme: dark;
  --bg: #090b10;
  --panel: #11151d;
  --line: #242b38;
  --accent: #ff6538;
  --text: #f4f6fb;
  --muted: #8e98aa;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px system-ui, sans-serif; height: 100dvh;
  display: flex; flex-direction: column;
}
header {
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; background:var(--panel);
  border-bottom:1px solid var(--line);
}
.logo { font-size:22px; font-weight:850; letter-spacing:-1px; }
.logo span { color:var(--accent); }
nav { display:flex; gap:7px; }
button {
  color:var(--text); background:#1b2230; border:1px solid var(--line);
  border-radius:9px; padding:9px 12px; cursor:pointer;
}
button:hover { border-color:var(--accent); }
.address {
  display:flex; flex:1; gap:8px; min-width:0;
}
input {
  width:100%; min-width:0; padding:11px 14px;
  border-radius:10px; border:1px solid var(--line);
  color:var(--text); background:#090d14; outline:none;
}
input:focus { border-color:var(--accent); }
#go { background:var(--accent); color:white; font-weight:700; }
#status {
  padding:7px 14px; color:var(--muted);
  border-bottom:1px solid var(--line); font-size:12px;
}
main { flex:1; min-height:0; position:relative; }
iframe { width:100%; height:100%; border:0; background:white; }
#welcome {
  position:absolute; inset:0; overflow:auto;
  display:flex; align-items:center; justify-content:center;
  text-align:center; padding:24px;
  background:radial-gradient(ellipse at top,#24202b,#090b10 65%);
}
.hero { max-width:650px; width:100%; }
.hero h1 { font-size:clamp(44px,9vw,80px); margin:0; letter-spacing:-5px; }
.hero h1 span { color:var(--accent); }
.hero p { color:var(--muted); line-height:1.7; }
.search { display:flex; gap:8px; margin:24px 0; }
.cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.card {
  background:var(--panel); border:1px solid var(--line);
  padding:16px 8px; border-radius:12px; cursor:pointer;
}
.card b { display:block; margin-bottom:6px; }
.card small { color:var(--muted); }
#rcOutput {
  display:none; position:absolute; inset:0; overflow:auto;
  padding:24px; background:#fff; color:#171717;
}
#rcOutput button { color:#171717; background:#eee; }
footer { padding:8px 14px; color:var(--muted); font-size:11px; }
@media(max-width:560px) {
  header { flex-wrap:wrap; }
  .address { order:3; flex-basis:100%; }
  .cards { grid-template-columns:1fr; }
  .card { padding:12px; }
}
</style>
<style>

    --bg-dark: #f8fafc;
    --bg-panel: #ffffff;

    --text-secondary: #475569;

    color: #0f172a;
}
body.theme-claro .file-tree, body.theme-claro .editor-container {
    background: #ffffff;
    color: #0f172a;

/* TEMAS: CLARO Y OSCURO */
body.theme-claro {
    --bg-dark: #f8fafc;
    --bg-panel: #ffffff;

    --border-color: #cbd5e1;

body.theme-claro .workspace,

<body>
<header style="border-radius: 18px;">
  <div class="logo">FRA<span>MEN</span></div>
  <nav>
    <button title="Atrás" onclick="back()">←</button>
    <button title="Adelante" onclick="forward()">→</button>
    <button title="Inicio" onclick="home()">⌂</button>
  </nav>
  <div class="address">
    <input id="url" placeholder="Buscar en Internet o escribir una dirección" autocomplete="url" onkeydown="if(event.key==='Enter')navigate()">
    <button id="go" onclick="navigate()" style="position: relative; left: 1px; top: 0px; width: 43px; height: 40px;">&nbsp;↗</button>
  </div>
</header>
<div id="status">Listo · Framen Browser</div>
<main>
  <section id="welcome">
    <div class="hero">
      <h1>Fra<span>men</span></h1>
      <p>Tu espacio para explorar Internet y experimentar con el lenguaje RC.</p>
      <div class="search">
        <input id="query" placeholder="¿Qué quieres encontrar?" onkeydown="if(event.key==='Enter')search()" style="border-radius: 22px;">
        <button id="go" onclick="search()">Buscar</button>
      </div>
      <div class="cards">
        <div class="card" onclick="quickSearch('documentación de programación')">
          <b>⌘ Explorar</b><small>Buscar en Internet</small>
        </div>
        <div class="card" onclick="openRC()">
          <b>‹/› Lenguaje RC</b><small>Abrir un archivo .rc</small>
        </div>
        <div class="card" onclick="quickSearch('noticias de tecnología')">
          <b>◈ Tecnología</b><small>Descubrir novedades</small>
        </div>
      </div>
      <input type="file" id="rcFile" accept=".rc,.txt" hidden="" onchange="loadRC(event)">
    </div>
  </section>
  <iframe id="web" hidden="" sandbox="allow-forms allow-scripts allow-same-origin allow-popups" referrerpolicy="no-referrer"></iframe>
  <section id="rcOutput"></section>
</main>
<footer>Framen · Prototipo experimental · Motor RC integrado en desarrollo</footer>

<script>
const $ = id => document.getElementById(id);
let historyList = [], historyIndex = -1;

function setStatus(text) { $('status').textContent = text; }

function home() {
  $('web').hidden = true;
  $('rcOutput').style.display = 'none';
  $('welcome').style.display = 'flex';
  $('url').value = '';
  setStatus('Inicio · Framen Browser');
}

function normalizeAddress(value) {
  value = value.trim();
  if (!value) return '';
  if (/^[a-z][a-z0-9+.-]*:/i.test(value)) return value;
  if (/^(localhost|[\w-]+\.[a-z]{2,})(:\d+)?(\/.*)?$/i.test(value))
    return 'https://' + value;
  return 'https://www.google.com/search?q=' + encodeURIComponent(value);
}

function navigate(addHistory = true) {
  const target = normalizeAddress($('url').value);
  if (!target) return;
  if (target.toLowerCase().endsWith('.rc')) {
    setStatus('Los archivos RC locales se abren mediante «Lenguaje RC».');
    return;
  }
  if (!/^https?:\/\//i.test(target)) {
    setStatus('Por seguridad, solo se admiten direcciones HTTP o HTTPS.');
    return;
  }
  $('welcome').style.display = 'none';
  $('rcOutput').style.display = 'none';
  $('web').hidden = false;
  $('url').value = target;
  $('web').src = target;
  setStatus('Intentando abrir: ' + target);
  if (addHistory) {
    historyList = historyList.slice(0, historyIndex + 1);
    historyList.push(target);
    historyIndex = historyList.length - 1;
  }
}

function search() {
  const value = $('query').value.trim();
  if (!value) return;
  $('url').value = value;
  navigate();
}
function quickSearch(value) {
  $('url').value = value;
  navigate();
}
function back() {
  if (historyIndex > 0) {
    historyIndex--;
    $('url').value = historyList[historyIndex];
    navigate(false);
  }
}
function forward() {
  if (historyIndex < historyList.length - 1) {
    historyIndex++;
    $('url').value = historyList[historyIndex];
    navigate(false);
  }
}
function openRC() { $('rcFile').click(); }

function loadRC(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => renderRC(String(reader.result));
  reader.readAsText(file);
  event.target.value = '';
}

/*
  Intérprete RC experimental.
  Este ejemplo solo implementa los comandos declarados abajo.
  Para reconocer toda la sintaxis oficial de tu lenguaje, conecta
  aquí la gramática y el intérprete reales de RC.
*/
function renderRC(source) {
  const out = $('rcOutput');
  out.replaceChildren();
  out.style.display = 'block';
  $('welcome').style.display = 'none';
  $('web').hidden = true;

  let background = '#ffffff';
  let color = '#171717';
  let title = 'Página RC';
  const elements = [];

  function parseColor(value) {
    const colors = {
      NEGRO:'#000000', BLANCO:'#ffffff', ROJO:'#ff0000',
      AZUL:'#0000ff', VERDE:'#008000', AMARILLO:'#ffff00',
      NARANJA:'#ff8800', MORADO:'#800080'
    };
    return colors[value.toUpperCase()] || value;
  }

  for (const [index, raw] of source.split(/\r?\n/).entries()) {
    const line = raw.trim();
    if (!line || line.startsWith('//') || line.startsWith('#')) continue;

    let match;
    if ((match = line.match(/^VENTANA\s+["'](.*?)["']$/i))) {
      title = match[1];
    } else if ((match = line.match(/^FONDO\s+(\S+)$/i))) {
      background = parseColor(match[1]);
    } else if ((match = line.match(/^COLOR\s+(\S+)$/i))) {
      color = parseColor(match[1]);
    } else if ((match = line.match(/^TEXTO\s+["'](.*?)["']$/i))) {
      elements.push({type:'text', value:match[1]});
    } else if ((match = line.match(/^BOTON\s+["'](.*?)["']$/i))) {
      elements.push({type:'button', value:match[1]});
    } else if ((match = line.match(/^BRILLO\s+(\d+)$/i))) {
      const amount = Number(match[1]);
      if (amount > 100) {
        showError(`Línea ${index+1}: BRILLO admite valores de 0 a 100.`);
        return;
      }
      elements.push({type:'brightness', value:amount});
    } else {
      showError(`Línea ${index+1}: comando no reconocido por este prototipo: ${line}`);
      return;
    }
  }

  out.style.background = background;
  out.style.color = color;
  out.style.filter = '';
  const heading = document.createElement('h1');
  heading.textContent = title;
  out.appendChild(heading);

  for (const el of elements) {
    if (el.type === 'text') {
      const p = document.createElement('p');
      p.textContent = el.value;
      out.appendChild(p);
    } else if (el.type === 'button') {
      const button = document.createElement('button');
      button.textContent = el.value;
      button.onclick = () => alert(el.value);
      out.appendChild(button);
    } else if (el.type === 'brightness') {
      out.style.filter = `brightness(${el.value}%)`;
    }
  }
  setStatus('Archivo RC cargado · ' + title);
}

function showError(message) {
  const out = $('rcOutput');
  out.replaceChildren();
  out.style.display = 'block';
  $('welcome').style.display = 'none';
  $('web').hidden = true;
  const error = document.createElement('pre');
  error.style.color = '#c62828';
  error.textContent = message;
  out.appendChild(error);
  setStatus('Error al interpretar RC');
}

$('web').addEventListener('load', () => {
  setStatus('Página cargada o intento de carga finalizado. Algunos sitios bloquean la inserción en marcos.');
});
</script>
