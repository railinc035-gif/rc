<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Framen - Entorno RC Studio</title>
<style>
:root {
  color-scheme: dark;
  --bg: #090b10;
  --panel: #11151d;
  --line: #242b38;
  --accent: #ff6538;
  --accent-glow: rgba(255, 101, 56, 0.25);
  --text: #f4f6fb;
  --muted: #8e98aa;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px system-ui, -apple-system, sans-serif; height: 100dvh;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; background:var(--panel);
  border-bottom:1px solid var(--line);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.logo { font-size:22px; font-weight:850; letter-spacing:-1px; cursor:pointer; user-select:none; }
.logo span { color:var(--accent); }
nav { display:flex; gap:7px; }
button {
  color:var(--text); background:#1b2230; border:1px solid var(--line);
  border-radius:9px; padding:9px 12px; cursor:pointer; font-weight:500;
  transition: all 0.2s ease;
}
button:hover { border-color:var(--accent); background: #232c3d; }
.address {
  display:flex; flex:1; gap:8px; min-width:0;
}
input {
  width:100%; min-width:0; padding:11px 14px;
  border-radius:10px; border:1px solid var(--line);
  color:var(--text); background:#090d14; outline:none;
  font-size: 13px; transition: border-color 0.2s ease;
}
input:focus { border-color:var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
#go { background:var(--accent); color:white; font-weight:700; border-color: var(--accent); }
#go:hover { background: #ff7a52; }
#status {
  padding:7px 14px; color:var(--muted);
  border-bottom:1px solid var(--line); font-size:12px; background: #0c0f16;
}
main { flex:1; min-height:0; position:relative; overflow: hidden; }
#welcome {
  position:absolute; inset:0; overflow-y:auto;
  display:flex; align-items:center; justify-content:center;
  text-align:center; padding:24px;
  background:radial-gradient(ellipse at top,#1e1828,#090b10 70%);
}
.hero { max-width:650px; width:100%; }
.hero h1 { font-size:clamp(44px,9vw,80px); margin:0; letter-spacing:-5px; }
.hero h1 span { color:var(--accent); }
.hero p { color:var(--muted); line-height:1.7; font-size: 15px; margin-bottom: 24px; }
.search { display:flex; gap:8px; margin:24px 0; }
.cards { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; max-width: 500px; margin: 0 auto; }
.card {
  background: rgba(17, 21, 29, 0.8);
  border: 1px solid var(--line);
  padding: 22px 16px; border-radius: 16px; cursor: pointer;
  transition: all 0.25s ease; backdrop-filter: blur(10px);
  text-align: center;
}
.card:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(255,101,56,0.25);
}
.card b { display:block; margin-bottom:6px; font-size: 16px; color: #f4f6fb; }
.card small { color:var(--muted); font-size: 13px; }

#rcOutput {
  display:none; position:absolute; inset:0; overflow-y:auto;
  padding:32px; background:#0b0d12; color:#f4f6fb;
}

/* Dynamic RC Component Styling */
.rc-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.rc-section { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 16px; margin-bottom: 12px; }
.rc-grid { display: grid; gap: 12px; }
.rc-button { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
.rc-button:hover { filter: brightness(1.15); transform: translateY(-1px); }
.rc-input, .rc-textarea { width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: white; outline: none; }
.rc-input:focus, .rc-textarea:focus { border-color: var(--accent); }
.rc-canvas { background: #141822; border: 1px solid var(--line); border-radius: 12px; cursor: crosshair; touch-action: none; display: block; margin: 10px 0; }
.rc-table { width: 100%; border-collapse: collapse; margin: 12px 0; }
.rc-table th, .rc-table td { border: 1px solid var(--line); padding: 10px; text-align: left; }
.rc-table th { background: rgba(255,255,255,0.05); }

/* Card de búsqueda e ideas de combinación */
.rc-doc-card {
  background: rgba(25, 29, 41, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 14px;
  padding: 16px 20px;
  margin-bottom: 12px;
  transition: all 0.2s ease;
  text-align: left;
}
.rc-doc-card:hover {
  background: rgba(35, 41, 58, 0.9);
  border-color: #ff6538;
}
.rc-combo-box {
  background: rgba(15, 20, 30, 0.9);
  border: 1px solid rgba(255, 101, 56, 0.3);
  border-radius: 12px;
  padding: 16px;
  margin-top: 10px;
}
.rc-combo-code {
  background: #05070a;
  color: #ff7a52;
  font-family: monospace;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  margin: 8px 0;
  white-space: pre-wrap;
}
.rc-chip {
  background: rgba(255, 255, 255, 0.06);
  color: #94a3b8;
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-block;
  margin: 2px;
}

footer { padding:8px 14px; color:var(--muted); font-size:11px; text-align: center; border-top: 1px solid var(--line); background: var(--panel); }
@media(max-width:600px) {
  header { flex-wrap:wrap; }
  .address { order:3; flex-basis:100%; }
  .cards { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="home()">FRA<span>MEN</span></div>
  <nav>
    <button title="Atrás" onclick="back()">←</button>
    <button title="Adelante" onclick="forward()">→</button>
    <button title="Inicio" onclick="home()">⌂</button>
  </nav>
  <div class="address">
    <input id="url" placeholder="Pregunta cómo combinar cualquier elemento o busca un comando RC..." autocomplete="off" onkeydown="if(event.key==='Enter')navigate()">
    <button id="go" onclick="navigate()">&nbsp;↗</button>
  </div>
</header>
<div id="status">Listo · Framen RC (Motor con 70 Comandos RC)</div>
<main>
  <section id="welcome">
    <div class="hero">
      <h1>Fra<span>men</span></h1>
      <p>Entorno minimalista e inteligente con exactamente 70 comandos oficiales del Lenguaje Rapid Code (RC).</p>
      <div class="search">
        <input id="query" placeholder="Ej: ¿Cómo puedo combinar un botón con diseño y lógica?" onkeydown="if(event.key==='Enter')search()">
        <button id="go" onclick="search()">Buscar</button>
      </div>
      <div class="cards">
        <div class="card" onclick="quickSearch('diccionario')">
          <b>⌘ Diccionario RC (70)</b><small>Ver los 70 comandos</small>
        </div>
        <div class="card" onclick="openRC()">
          <b>‹/› Cargar archivo .RC</b><small>Abrir archivo local</small>
        </div>
      </div>
      <input type="file" id="rcFile" accept=".rc,.txt" hidden onchange="loadRC(event)">
    </div>
  </section>
  <section id="rcOutput"></section>
</main>
<footer>Framen Studio · Motor Nativo RC de 70 Comandos</footer>

<script>
const $ = id => document.getElementById(id);
let historyList = ['home'], historyIndex = 0;

// Exactamente 70 Comandos Oficiales del Lenguaje RC divididos en Estructura (25), Diseño (25) y Lógica (20)
const RC_DICTIONARY = [
  // --- ESTRUCTURA DE INTERFAZ (25) ---
  { cmd: "incluir(archivo.rc)", desc: "Conecta e incluye otro archivo .rc en la aplicación", tag: "estructura" },
  { cmd: "titulo(texto)", desc: "Establece el título principal de la ventana o aplicación", tag: "estructura" },
  { cmd: "seccion(id)", desc: "Crea una sección o bloque contenedor delimitado", tag: "estructura" },
  { cmd: "contenedor(id)", desc: "Crea un contenedor flexible agrupador de elementos", tag: "estructura" },
  { cmd: "rejilla(columnas)", desc: "Crea una cuadrícula adaptable de N columnas", tag: "estructura" },
  { cmd: "linea", desc: "Inserta un separador visual horizontal", tag: "estructura" },
  { cmd: "texto(mensaje)", desc: "Muestra un mensaje o párrafo de texto libre", tag: "estructura" },
  { cmd: "encabezado(nivel)(mensaje)", desc: "Inserta un título visual destacado del nivel 1 al 6", tag: "estructura" },
  { cmd: "parrafo(mensaje)", desc: "Crea un bloque de párrafo explicativo", tag: "estructura" },
  { cmd: "negrita(texto)", desc: "Resalta un fragmento de texto en negrita", tag: "estructura" },
  { cmd: "cursiva(texto)", desc: "Formatea un fragmento de texto en cursiva", tag: "estructura" },
  { cmd: "subrayado(texto)", desc: "Aplica subrayado continuo al texto indicado", tag: "estructura" },
  { cmd: "etiqueta(id)(texto)", desc: "Crea un elemento de texto dinámico modificable por id", tag: "estructura" },
  { cmd: "cita(texto)", desc: "Crea un bloque destacado de cita textual", tag: "estructura" },
  { cmd: "codigo(texto)", desc: "Muestra un bloque formateado de código monospaciado", tag: "estructura" },
  { cmd: "enlace(url)(texto)", desc: "Inserta un hipervínculo navegable", tag: "estructura" },
  { cmd: "imagen(url)", desc: "Muestra una imagen desde la dirección url", tag: "estructura" },
  { cmd: "boton(id)(texto)", desc: "Crea un botón interactivo identificado por id", tag: "estructura" },
  { cmd: "etiquetacampo(texto)", desc: "Muestra una etiqueta descriptiva sobre un campo", tag: "estructura" },
  { cmd: "entrada(id)(valor)", desc: "Crea un campo para ingreso de texto general", tag: "estructura" },
  { cmd: "camponumero(id)(val)", desc: "Crea un campo para ingreso exclusivo de números", tag: "estructura" },
  { cmd: "campocorreo(id)(val)", desc: "Crea un campo especializado en direcciones de correo", tag: "estructura" },
  { cmd: "campocontrasena(id)", desc: "Crea un campo con caracteres ocultos para contraseña", tag: "estructura" },
  { cmd: "areatexto(id)(texto)", desc: "Crea un área de entrada multilínea para textos largos", tag: "estructura" },
  { cmd: "lienzo(id)", desc: "Crea una pizarra o lienzo 2D interactivo para dibujo", tag: "estructura" },

  // --- DISEÑO Y ESTILOS VISUALES (25) ---
  { cmd: "fondo(color)", desc: "Aplica el color de fondo general de la aplicación", tag: "diseño" },
  { cmd: "color(color)", desc: "Establece el color principal del texto", tag: "diseño" },
  { cmd: "letra(fuente)", desc: "Cambia la tipografía de letra de la aplicación", tag: "diseño" },
  { cmd: "tamano(id)(px)", desc: "Define el tamaño de texto en píxeles para un elemento", tag: "diseño" },
  { cmd: "ancho(id)(px)", desc: "Ajusta el ancho fijo en píxeles de un elemento", tag: "diseño" },
  { cmd: "alto(id)(px)", desc: "Ajusta el alto fijo en píxeles de un elemento", tag: "diseño" },
  { cmd: "centrar(id)", desc: "Centra horizontalmente un contenedor o elemento", tag: "diseño" },
  { cmd: "gap(id)(px)", desc: "Ajusta la separación interna entre elementos de una rejilla", tag: "diseño" },
  { cmd: "borde(id)(px)(color)", desc: "Aplica un borde de N píxeles y color al elemento", tag: "diseño" },
  { cmd: "radio(id)(px)", desc: "Aplica curvatura o redondeo a las esquinas del elemento", tag: "diseño" },
  { cmd: "sombracaja(id)(x)(y)(blur)(color)", desc: "Aplica sombra difuminada con coordenadas x y blur al elemento", tag: "diseño" },
  { cmd: "gradiente(id)(color1)(color2)", desc: "Aplica un fondo con degradado suave de dos colores", tag: "diseño" },
  { cmd: "efectoglass(id)", desc: "Aplica diseño de cristal translúcido con desenfoque de fondo", tag: "diseño" },
  { cmd: "resplandor(id)(color)", desc: "Crea un resplandor o brillo neón alrededor del elemento", tag: "diseño" },

  { cmd: "pad(id)(px)", desc: "Ajusta el relleno interno de espacio del elemento", tag: "diseño" },
  { cmd: "margen(id)(px)", desc: "Ajusta el margen externo de separación alrededor del elemento", tag: "diseño" },
  { cmd: "alineartexto(id)(modo)", desc: "Alinea el texto al centro izquierda o derecha", tag: "diseño" },
  { cmd: "transformar(id)(escala)", desc: "Escala proporcionalmente el tamaño visual del elemento", tag: "diseño" },
  { cmd: "rotar(id)(grados)", desc: "Gira visualmente el elemento N grados", tag: "diseño" },
  { cmd: "fijarposicion(id)(modo)", desc: "Modifica la posición estática o fija del elemento", tag: "diseño" },
  { cmd: "capa(id)(nivel)", desc: "Ajusta la profundidad o nivel de capa de superposición", tag: "diseño" },
  { cmd: "ocultar(id)", desc: "Vuelve invisible cualquier elemento por su id", tag: "diseño" },
  { cmd: "mostrar(id)", desc: "Restablece la visibilidad de un elemento oculto", tag: "diseño" },

  // --- LÓGICA Y COMPORTAMIENTO (20) ---
  { cmd: "avisar(idbtn)(msg)", desc: "Muestra una ventana de notificación o alerta al pulsar un botón", tag: "lógica" },
  { cmd: "limpiar(idbtn)(idin)", desc: "Vacía el contenido de un campo de entrada al pulsar un botón", tag: "lógica" },
  { cmd: "limpiarlienzo(idbtn)(idlienzo)", desc: "Borra todos los trazos realizados en un lienzo al pulsar un botón", tag: "lógica" },
  { cmd: "ocultarboton(idbtn)(id)", desc: "Oculta un elemento especificado al presionar el botón", tag: "lógica" },
  { cmd: "mostrarboton(idbtn)(id)", desc: "Muestra un elemento oculto al presionar el botón", tag: "lógica" },
  { cmd: "alternar(idbtn)(id)", desc: "Intercala entre mostrar u ocultar un elemento al presionar el botón", tag: "lógica" },
  { cmd: "sumar(idbtn)(in1)(in2)(lbl)", desc: "Suma dos campos y muestra el resultado en la etiqueta", tag: "lógica" },
  { cmd: "restar(idbtn)(in1)(in2)(lbl)", desc: "Resta dos campos y muestra el resultado en la etiqueta", tag: "lógica" },
  { cmd: "multiplicar(idbtn)(in1)(in2)(lbl)", desc: "Multiplica dos campos y muestra el resultado en la etiqueta", tag: "lógica" },
  { cmd: "dividir(idbtn)(in1)(in2)(lbl)", desc: "Divide dos campos y muestra el resultado en la etiqueta", tag: "lógica" },
  { cmd: "deshabilitar(idbtn)(id)", desc: "Desactiva la interacción de un campo o botón", tag: "lógica" },
  { cmd: "habilitar(idbtn)(id)", desc: "Reactiva la interacción de un elemento desactivado", tag: "lógica" },
  { cmd: "copiartexto(idbtn)(idin)", desc: "Copia el contenido de un campo al portapapeles al pulsar el botón", tag: "lógica" },
  { cmd: "fijartexto(idbtn)(lbl)(msg)", desc: "Asigna dinámicamente un texto a una etiqueta al pulsar un botón", tag: "lógica" },
  { cmd: "alternarclase(idbtn)(id)(estilo)", desc: "Activa o desactiva un efecto visual al pulsar un botón", tag: "lógica" },
  { cmd: "guardardato(idbtn)(clave)(idin)", desc: "Almacena localmente un dato capturado en un campo", tag: "lógica" },
  { cmd: "cargardato(idbtn)(clave)(lbl)", desc: "Recupera un dato almacenado y lo muestra en la etiqueta", tag: "lógica" },
  { cmd: "borrardato(idbtn)(clave)", desc: "Elimina un dato almacenado localmente por su clave", tag: "lógica" },
  { cmd: "temporizador(idbtn)(seg)(lbl)", desc: "Inicia una cuenta regresiva de segundos en la etiqueta", tag: "lógica" },
  { cmd: "sonido(idbtn)(tono)", desc: "Emite un tono o señal acústica al presionar un botón", tag: "lógica" }
];

// Base de respuestas para combinaciones de comandos RC
const INTELLIGENT_COMBINATIONS = {
  "boton": {
    topic: "Botón (boton)",
    explanation: "Un botón en RC se combina con comandos de estructura, diseño visual y lógica de interacción:",
    options: [
      {
        title: "✨ Combinar Botón con Estilo Resplandor Neón y Alerta",
        details: "Aplica resplandor() y efectoelevar() al botón y conéctalo con avisar():",
        code: `boton(btnneon)(presioname)
resplandor(btnneon)(ff6538)
efectoelevar(btnneon)
avisar(btnneon)(has activado un boton moderno en rc)`
      },
      {
        title: "⚡ Combinar Botón con Campo de Entrada y Borrador",
        details: "Crea una entrada() y vacíala al pulsar el botón con limpiar():",
        code: `etiquetacampo(ingresa un texto)
entrada(micampo)(texto de prueba)
boton(btnborrar)(limpiar entrada)
limpiar(btnborrar)(micampo)`
      },
      {
        title: "🧮 Combinar Botón con Cálculo de Suma",
        details: "Conecta dos campos numéricos y un botón con sumar() para mostrar el resultado:",
        code: `camponumero(num1)(15)
camponumero(num2)(35)
boton(btncalc)(calcular suma)
etiqueta(lblres)(resultado de la suma)
sumar(btncalc)(num1)(num2)(lblres)`
      }
    ]
  },
  "entrada": {
    topic: "Campo de Entrada (entrada)",
    explanation: "Las entradas capturan texto y se combinan con etiquetas, botones de acción y limpieza:",
    options: [
      {
        title: "📋 Combinación de Formulario Completo",
        details: "Campo de entrada con diseño de borde y confirmación por botón:",
        code: `etiquetacampo(nombre de usuario)
entrada(inusuario)(juan)
borde(inusuario)(2)(ff6538)
boton(btnconfirmar)(guardar)
avisar(btnconfirmar)(datos guardados con exito)`
      }
    ]
  },
  "lienzo": {
    topic: "Lienzo y Pizarra (lienzo)",
    explanation: "El lienzo permite realizar trazos 2D interactivos y se combina con resplandor() y limpiarlienzo():",
    options: [
      {
        title: "🎨 Pizarra con Resplandor y Borrador",
        details: "Lienzo rodeado de brillo con un botón para limpiar trazos:",
        code: `lienzo(pizarra2d)
resplandor(pizarra2d)(3b82f6)
boton(btnlimpiar)(borrar lienzo)
limpiarlienzo(btnlimpiar)(pizarra2d)`
      }
    ]
  }
};

function setStatus(text) { $('status').textContent = text; }

function home() {
  $('rcOutput').style.display = 'none';
  $('welcome').style.display = 'flex';
  $('url').value = '';
  setStatus('Listo · Framen RC (70 Comandos)');
  recordHistory('home');
}

function recordHistory(state) {
  if (historyList[historyIndex] !== state) {
    historyList = historyList.slice(0, historyIndex + 1);
    historyList.push(state);
    historyIndex = historyList.length - 1;
  }
}

function back() {
  if (historyIndex > 0) {
    historyIndex--;
    const state = historyList[historyIndex];
    if (state === 'home') home();
    else if (state.startsWith('search:')) performSearch(state.replace('search:', ''), false);
  }
}

function forward() {
  if (historyIndex < historyList.length - 1) {
    historyIndex++;
    const state = historyList[historyIndex];
    if (state === 'home') home();
    else if (state.startsWith('search:')) performSearch(state.replace('search:', ''), false);
  }
}

function openRC() { $('rcFile').click(); }

function loadRC(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    renderRC(String(reader.result));
    setStatus('Archivo RC cargado: ' + file.name);
  };
  reader.readAsText(file);
  event.target.value = '';
}

function runSnippet(code) {
  renderRC(code);
}

function search() {
  const q = $('query').value.trim();
  if (q) performSearch(q);
}

function quickSearch(q) {
  $('query').value = q;
  performSearch(q);
}

function navigate() {
  const q = $('url').value.trim();
  if (!q) return;
  if (q.includes('(') && q.includes(')')) {
    renderRC(q);
  } else {
    performSearch(q);
  }
}

// Búsqueda Inteligente para el Lenguaje RC
function performSearch(query, trackHistory = true) {
  const out = $('rcOutput');
  out.replaceChildren();
  out.style.display = 'block';
  $('welcome').style.display = 'none';

  const container = document.createElement('div');
  container.className = 'rc-container';

  const normalizeText = str => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const qClean = normalizeText(query);

  const h = document.createElement('h2');
  h.style.color = '#f4f6fb';
  h.textContent = `Asistente e Intérprete RC: "${query}"`;
  container.appendChild(h);

  let handledIntelligent = false;

  for (const [key, comboInfo] of Object.entries(INTELLIGENT_COMBINATIONS)) {
    if (qClean.includes(key)) {
      handledIntelligent = true;

      const aiCard = document.createElement('div');
      aiCard.className = 'rc-doc-card';
      aiCard.style.borderColor = '#ff6538';
      aiCard.style.background = 'rgba(255, 101, 56, 0.06)';

      let cardHtml = `<h3 style="color:#ff6538; margin-top:0;">💡 Combinaciones Inteligentes para ${key.toUpperCase()}</h3>
                      <p style="color:#cbd5e1; font-size:14px; line-height:1.5;">${comboInfo.explanation}</p>`;

      comboInfo.options.forEach(opt => {
        cardHtml += `<div class="rc-combo-box">
          <strong style="color:#f4f6fb; font-size:14px;">${opt.title}</strong>
          <p style="color:#94a3b8; font-size:12px; margin:4px 0;">${opt.details}</p>
          <pre class="rc-combo-code">${opt.code}</pre>
          <button class="rc-button" style="padding:6px 14px; font-size:12px;" onclick="runSnippet(\`${opt.code.replace(/`/g, '')}\`)">▶ Probar Esta Combinación</button>
        </div>`;
      });

      aiCard.innerHTML = cardHtml;
      container.appendChild(aiCard);
    }
  }

  const matches = RC_DICTIONARY.filter(item => {
    const cmdNorm = normalizeText(item.cmd);
    const descNorm = normalizeText(item.desc);
    return cmdNorm.includes(qClean) || descNorm.includes(qClean) || qClean.includes(item.tag) || qClean.includes('diccionario');
  });

  if (matches.length > 0) {
    const listHeader = document.createElement('h3');
    listHeader.textContent = qClean.includes('diccionario') ? 'Diccionario Oficial de 70 Comandos RC:' : 'Comandos RC Encontrados:';
    listHeader.style.marginTop = '20px';
    container.appendChild(listHeader);

    matches.forEach(item => {
      const card = document.createElement('div');
      card.className = 'rc-doc-card';
      card.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-family:monospace; font-weight:bold; color:#ff6538; font-size:15px;">${item.cmd}</span>
        <span class="rc-chip">${item.tag.toUpperCase()}</span>
      </div>
      <div style="color:#94a3b8; font-size:13px; margin-top:6px;">${item.desc}</div>
      <button class="rc-button" style="margin-top:10px; padding:4px 10px; font-size:11px;" onclick="runSnippet('${item.cmd}')">Ejecutar Comando</button>`;
      container.appendChild(card);
    });
  } else if (!handledIntelligent) {
    const p = document.createElement('p');
    p.textContent = 'No se encontraron comandos exactos. Escribe código RC directamente o busca por ej: "¿cómo combinar un botón?"';
    container.appendChild(p);
  }

  out.appendChild(container);
  setStatus(`Búsqueda RC: "${query}"`);
  if (trackHistory) recordHistory('search:' + query);
}

/*
  Motor Intérprete Nativo para los 70 Comandos Oficiales del Lenguaje RC
*/
function renderRC(source) {
  const out = $('rcOutput');
  out.replaceChildren();
  out.style.display = 'block';
  $('welcome').style.display = 'none';

  const container = document.createElement('div');
  container.className = 'rc-container';
  out.appendChild(container);

  let currentParent = container;
  const eventQueue = [];

  const lines = source.split(/\r?\n/);
  lines.forEach((rawLine) => {
    let line = rawLine.trim();
    if (!line || line.startsWith('//')) return;

    line = line.toLowerCase();

    const cmdMatch = line.match(/^([a-z0-9]+)(\(.*\))?$/);
    if (!cmdMatch) return;

    const cmd = cmdMatch[1];
    const argsStr = cmdMatch[2] || '';

    const args = [];
    const argRegex = /\((.*?)\)/g;
    let m;
    while ((m = argRegex.exec(argsStr)) !== null) {
      args.push(m[1]);
    }

    try {
      switch (cmd) {
        // --- ESTRUCTURA DE INTERFAZ (25) ---
        case 'incluir':
          break;
        case 'titulo':
          if (args[0]) document.title = args[0];
          break;
        case 'seccion':
          const sec = document.createElement('div');
          if (args[0]) sec.id = args[0];
          sec.className = 'rc-section';
          container.appendChild(sec);
          currentParent = sec;
          break;
        case 'contenedor':
          const cont = document.createElement('div');
          if (args[0]) cont.id = args[0];
          cont.className = 'rc-container';
          currentParent.appendChild(cont);
          currentParent = cont;
          break;
        case 'rejilla':
          const grid = document.createElement('div');
          grid.className = 'rc-grid';
          grid.style.gridTemplateColumns = `repeat(${args[0] || 2}, 1fr)`;
          currentParent.appendChild(grid);
          currentParent = grid;
          break;
        case 'linea':
          const hr = document.createElement('hr');
          hr.style.borderColor = 'var(--line)';
          hr.style.margin = '16px 0';
          currentParent.appendChild(hr);
          break;
        case 'texto':
        case 'parrafo':
        case 'bloque':
          const p = document.createElement('p');
          p.textContent = args[0] || '';
          currentParent.appendChild(p);
          break;
        case 'encabezado':
          const level = Math.min(Math.max(parseInt(args[0]) || 1, 1), 6);
          const h = document.createElement('h' + level);
          h.textContent = args[1] || args[0] || '';
          currentParent.appendChild(h);
          break;
        case 'negrita':
          const b = document.createElement('strong');
          b.textContent = args[0] || '';
          currentParent.appendChild(b);
          break;
        case 'cursiva':
          const em = document.createElement('em');
          em.textContent = args[0] || '';
          currentParent.appendChild(em);
          break;
        case 'subrayado':
          const u = document.createElement('u');
          u.textContent = args[0] || '';
          currentParent.appendChild(u);
          break;
        case 'etiqueta':
          const lbl = document.createElement('span');
          if (args[0]) lbl.id = args[0];
          lbl.textContent = args[1] || '';
          lbl.style.display = 'inline-block';
          lbl.style.margin = '4px 0';
          currentParent.appendChild(lbl);
          break;
        case 'cita':
          const q = document.createElement('blockquote');
          q.textContent = args[0] || '';
          q.style.borderLeft = '4px solid var(--accent)';
          q.style.paddingLeft = '12px';
          currentParent.appendChild(q);
          break;
        case 'codigo':
          const pre = document.createElement('pre');
          pre.textContent = args[0] || '';
          pre.style.background = 'rgba(0,0,0,0.5)';
          pre.style.padding = '12px';
          pre.style.borderRadius = '8px';
          currentParent.appendChild(pre);
          break;
        case 'enlace':
          const a = document.createElement('a');
          a.href = args[0] || '#';
          a.textContent = args[1] || args[0] || '';
          a.style.color = 'var(--accent)';
          currentParent.appendChild(a);
          break;
        case 'imagen':
          const img = document.createElement('img');
          img.src = args[0] || '';
          img.style.maxWidth = '100%';
          img.style.borderRadius = '8px';
          currentParent.appendChild(img);
          break;
        case 'boton':
          const btn = document.createElement('button');
          btn.className = 'rc-button';
          if (args[0]) btn.id = args[0];
          btn.textContent = args[1] || args[0] || 'Botón';
          currentParent.appendChild(btn);
          break;
        case 'etiquetacampo':
          const fieldLbl = document.createElement('label');
          fieldLbl.textContent = args[0] || '';
          fieldLbl.style.display = 'block';
          fieldLbl.style.marginTop = '8px';
          fieldLbl.style.fontWeight = '600';
          currentParent.appendChild(fieldLbl);
          break;
        case 'entrada':
          const inTxt = document.createElement('input');
          inTxt.type = 'text';
          inTxt.className = 'rc-input';
          if (args[0]) inTxt.id = args[0];
          if (args[1]) inTxt.value = args[1];
          currentParent.appendChild(inTxt);
          break;
        case 'camponumero':
          const inNum = document.createElement('input');
          inNum.type = 'number';
          inNum.className = 'rc-input';
          if (args[0]) inNum.id = args[0];
          if (args[1]) inNum.value = args[1];
          currentParent.appendChild(inNum);
          break;
        case 'campocorreo':
          const inEmail = document.createElement('input');
          inEmail.type = 'email';
          inEmail.className = 'rc-input';
          if (args[0]) inEmail.id = args[0];
          if (args[1]) inEmail.value = args[1];
          currentParent.appendChild(inEmail);
          break;
        case 'campocontrasena':
          const inPass = document.createElement('input');
          inPass.type = 'password';
          inPass.className = 'rc-input';
          if (args[0]) inPass.id = args[0];
          currentParent.appendChild(inPass);
          break;
        case 'areatexto':
          const txtArea = document.createElement('textarea');
          txtArea.className = 'rc-textarea';
          txtArea.rows = 4;
          if (args[0]) txtArea.id = args[0];
          if (args[1]) txtArea.value = args[1];
          currentParent.appendChild(txtArea);
          break;
        case 'lienzo':
          const cvs = document.createElement('canvas');
          if (args[0]) cvs.id = args[0];
          cvs.className = 'rc-canvas';
          cvs.width = 600;
          cvs.height = 300;
          currentParent.appendChild(cvs);

          const ctx = cvs.getContext('2d');
          let drawing = false;
          cvs.onpointerdown = e => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
          cvs.onpointermove = e => { if (drawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.strokeStyle = '#ff6538'; ctx.lineWidth = 3; ctx.stroke(); } };
          cvs.onpointerup = () => { drawing = false; };
          break;

        // --- DISEÑO Y ESTILOS VISUALES (25) ---
        case 'fondo':
          out.style.background = '#' + (args[0] || '0b0d12').replace('#','');
          break;
        case 'color':
          out.style.color = '#' + (args[0] || 'f4f6fb').replace('#','');
          break;
        case 'letra':
          out.style.fontFamily = args[0] || 'sans-serif';
          break;
        case 'tamano':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.fontSize = (args[1] || 14) + 'px';
          });
          break;
        case 'ancho':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.width = (args[1] || 200) + 'px';
          });
          break;
        case 'alto':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.height = (args[1] || 100) + 'px';
          });
          break;
        case 'centrar':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) { el.style.margin = '0 auto'; el.style.textAlign = 'center'; }
          });
          break;
        case 'gap':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.gap = (args[1] || 10) + 'px';
          });
          break;
        case 'borde':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.border = `${args[1] || 1}px solid #${(args[2] || 'ff6538').replace('#','')}`;
          });
          break;
        case 'radio':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.borderRadius = (args[1] || 8) + 'px';
          });
          break;
        case 'sombracaja':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.boxShadow = `${args[1]||0}px ${args[2]||4}px ${args[3]||15}px #${(args[4]||'000000').replace('#','')}`;
          });
          break;
        case 'gradiente':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.background = `linear-gradient(135deg, #${(args[1]||'ff6538').replace('#','')}, #${(args[2]||'ff8c00').replace('#','')})`;
          });
          break;
        case 'efectoglass':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) {
              el.style.background = 'rgba(255, 255, 255, 0.05)';
              el.style.backdropFilter = 'blur(12px)';
              el.style.border = '1px solid rgba(255, 255, 255, 0.12)';
              el.style.borderRadius = '16px';
            }
          });
          break;
        case 'resplandor':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) {
              const col = '#' + (args[1] || 'ff6538').replace('#','');
              el.style.boxShadow = `0 0 15px ${col}`;
              el.style.borderColor = col;
            }
          });
          break;
        case 'efectoelevar':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) {
              el.style.transition = 'transform 0.2s ease';
              el.onmouseenter = () => { el.style.transform = 'translateY(-3px)'; };
              el.onmouseleave = () => { el.style.transform = 'translateY(0px)'; };
            }
          });
          break;
        case 'opacidad':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.opacity = (parseFloat(args[1]) || 100) / 100;
          });
          break;
        case 'pad':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.padding = (args[1] || 10) + 'px';
          });
          break;
        case 'margen':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.margin = (args[1] || 10) + 'px';
          });
          break;
        case 'alineartexto':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.textAlign = args[1] || 'center';
          });
          break;
        case 'transformar':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.transform = `scale(${args[1] || 1})`;
          });
          break;
        case 'rotar':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.transform = `rotate(${args[1] || 0}deg)`;
          });
          break;
        case 'fijarposicion':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.position = args[1] || 'relative';
          });
          break;
        case 'capa':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.zIndex = args[1] || 1;
          });
          break;
        case 'ocultar':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.display = 'none';
          });
          break;
        case 'mostrar':
          eventQueue.push(() => {
            const el = $(args[0]);
            if (el) el.style.display = 'block';
          });
          break;

        // --- LÓGICA Y COMPORTAMIENTO (20) ---
        case 'avisar':
          eventQueue.push(() => {
            const btn = $(args[0]);
            if (btn) btn.onclick = () => alert(args[1] || 'Aviso RC');
          });
          break;
        case 'limpiar':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const target = $(args[1]);
            if (btn && target) btn.onclick = () => { target.value = ''; };
          });
          break;
        case 'limpiarlienzo':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const cvs = $(args[1]);
            if (btn && cvs) {
              btn.onclick = () => {
                const ctx = cvs.getContext('2d');
                ctx.clearRect(0, 0, cvs.width, cvs.height);
              };
            }
          });
          break;
        case 'ocultarboton':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const target = $(args[1]);
            if (btn && target) btn.onclick = () => { target.style.display = 'none'; };
          });
          break;
        case 'mostrarboton':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const target = $(args[1]);
            if (btn && target) btn.onclick = () => { target.style.display = 'block'; };
          });
          break;
        case 'alternar':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const target = $(args[1]);
            if (btn && target) btn.onclick = () => {
              target.style.display = target.style.display === 'none' ? 'block' : 'none';
            };
          });
          break;
        case 'sumar':
        case 'restar':
        case 'multiplicar':
        case 'dividir':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const in1 = $(args[1]);
            const in2 = $(args[2]);
            const lbl = $(args[3]);
            if (btn && in1 && in2 && lbl) {
              btn.onclick = () => {
                const v1 = parseFloat(in1.value) || 0;
                const v2 = parseFloat(in2.value) || 0;
                let res = 0;
                if (cmd === 'sumar') res = v1 + v2;
                if (cmd === 'restar') res = v1 - v2;
                if (cmd === 'multiplicar') res = v1 * v2;
                if (cmd === 'dividir') res = v2 !== 0 ? v1 / v2 : 'Error Div/0';
                lbl.textContent = 'Resultado: ' + res;
              };
            }
          });
          break;
        case 'deshabilitar':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const target = $(args[1]);
            if (btn && target) btn.onclick = () => { target.disabled = true; };
          });
          break;
        case 'habilitar':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const target = $(args[1]);
            if (btn && target) btn.onclick = () => { target.disabled = false; };
          });
          break;
        case 'copiartexto':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const target = $(args[1]);
            if (btn && target) btn.onclick = () => { navigator.clipboard.writeText(target.value || target.textContent); alert('Texto copiado'); };
          });
          break;
        case 'fijartexto':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const target = $(args[1]);
            if (btn && target) btn.onclick = () => { target.textContent = args[2] || ''; };
          });
          break;
        case 'alternarclase':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const target = $(args[1]);
            if (btn && target) btn.onclick = () => { target.classList.toggle('activo'); };
          });
          break;
        case 'guardardato':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const input = $(args[2]);
            if (btn && input) btn.onclick = () => { localStorage.setItem(args[1], input.value); alert('Dato guardado en RC'); };
          });
          break;
        case 'cargardato':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const lbl = $(args[2]);
            if (btn && lbl) btn.onclick = () => { lbl.textContent = localStorage.getItem(args[1]) || 'No hay dato'; };
          });
          break;
        case 'borrardato':
          eventQueue.push(() => {
            const btn = $(args[0]);
            if (btn) btn.onclick = () => { localStorage.removeItem(args[1]); alert('Dato eliminado'); };
          });
          break;
        case 'temporizador':
          eventQueue.push(() => {
            const btn = $(args[0]);
            const lbl = $(args[2]);
            if (btn && lbl) {
              btn.onclick = () => {
                let seg = parseInt(args[1]) || 5;
                lbl.textContent = 'Tiempo: ' + seg;
                const timer = setInterval(() => {
                  seg--;
                  lbl.textContent = 'Tiempo: ' + seg;
                  if (seg <= 0) { clearInterval(timer); lbl.textContent = 'Tiempo finalizado!'; }
                }, 1000);
              };
            }
          });
          break;
        case 'sonido':
          eventQueue.push(() => {
            const btn = $(args[0]);
            if (btn) btn.onclick = () => {
              try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.frequency.value = parseInt(args[1]) || 440;
                osc.connect(ctx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 200);
              } catch(e){}
            };
          });
          break;
      }
    } catch(e) {
      console.error('Error procesando comando RC:', line, e);
    }
  });

  setTimeout(() => {
    eventQueue.forEach(fn => fn());
  }, 10);
}
</script>
