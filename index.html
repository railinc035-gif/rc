<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC Studio 4.0</title>
<style>
:root {
  color-scheme: dark;
  --bg:#101012;
  --panel:#19191d;
  --border:#303036;
  --text:#f4f4f5;
  --muted:#a1a1aa;
  --accent:#f97316;
}
* { box-sizing:border-box }
body {
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,sans-serif;
}
header {
  height:58px;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;
  border-bottom:1px solid var(--border);background:#151518;
}
.brand {font-weight:800;letter-spacing:.4px}
.brand span {color:var(--accent)}
.actions {display:flex;gap:7px;align-items:center}
button {
  color:var(--text);background:#29292f;border:1px solid #414149;
  border-radius:8px;padding:8px 11px;cursor:pointer;font:inherit;
}
button:hover {background:#38383f}
.primary {background:#ea580c;border-color:#ea580c}
.primary:hover {background:#c2410c}
.menu-wrap {position:relative}
#exportMenu {
  display:none;position:absolute;top:44px;right:0;width:220px;
  padding:8px;border:1px solid var(--border);border-radius:10px;
  background:#202024;box-shadow:0 12px 40px #0008;z-index:20;
}
#exportMenu.open {display:block}
#exportMenu button {width:100%;text-align:left;margin:3px 0}
main {
  display:grid;grid-template-columns:minmax(0,1fr) 8px minmax(0,1fr);
  height:calc(100dvh - 58px);min-height:0;
}
.pane {min-width:0;min-height:0;display:flex;flex-direction:column}
.pane-head {
  height:43px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;gap:6px;padding:0 10px;
  border-bottom:1px solid var(--border);font-size:13px;
}
.pane + .pane {border-left:1px solid var(--border)}
.file-head-left {display:flex;align-items:center;gap:6px;min-width:0}
#toggleExplorer {font-size:18px;padding:2px 8px}
#activeFileName {overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status {font-size:11px;color:var(--muted);white-space:nowrap}
.editor-workspace {display:flex;flex:1;min-height:0;min-width:0;position:relative}
#explorer {
  display:none;flex-shrink:0;width:190px;overflow:auto;
  border-right:1px solid var(--border);background:#151518;padding:9px;z-index:5;
}
#explorer.open {display:block}
.explorer-title {
  color:var(--muted);font-size:11px;letter-spacing:1px;margin:5px 0 10px;
}
.explorer-actions {display:flex;gap:5px;margin-bottom:9px}
.explorer-actions button {flex:1;padding:7px 4px;font-size:12px}
.file-item {display:flex;align-items:center;gap:3px;margin:4px 0}
.file-select {
  flex:1;min-width:0;text-align:left;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;padding:7px 6px;font-size:12px;
}
.file-selected {border-color:var(--accent);background:#3a251b}
.file-tools {display:flex;gap:2px}
.file-tools button {padding:5px;font-size:12px}

.code-container {
  display:flex;flex:1;min-width:0;min-height:0;background:#101012;overflow:hidden;
}
#lineNumbers {
  width:45px;background:#151518;color:#52525b;padding:17px 6px 17px 0;
  text-align:right;font:14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;
  user-select:none;overflow:hidden;border-right:1px solid var(--border);
}
#editor {
  display:block;flex:1;width:0;min-width:0;min-height:0;
  resize:none;padding:17px;border:0;outline:0;
  background:#101012;color:var(--text);
  font:14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;
  tab-size:4;white-space:pre;overflow:auto;
}

#preview {width:100%;flex:1;min-height:0;border:0;background:white}
#splitter {background:#303036;cursor:col-resize;touch-action:none;z-index:2}
#splitter:hover,#splitter.dragging {background:var(--accent)}
#toast {
  position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
  background:#29292f;border:1px solid #414149;border-radius:9px;
  padding:10px 14px;font-size:13px;display:none;z-index:50;
  max-width:90vw;
}
#toast.show {display:block}
@media(max-width:700px) {
  header {padding:0 8px}
  .brand {font-size:13px}
  .actions {gap:4px}
  header button {font-size:12px;padding:7px}
  main {
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) 8px minmax(0,1fr);
  }
  .pane + .pane {border-left:0}
  #splitter {cursor:row-resize}
  #explorer {width:145px}
  .status {font-size:10px}
}
</style>
</head>
<body>
<header>
  <div class="brand">RC <span>STUDIO</span> 4.0</div>
  <div class="actions">
    <button id="clearBtn" title="Borrar contenido del archivo">Borrar</button>
    <div class="menu-wrap">
      <button id="exportBtn" class="primary" aria-haspopup="true" aria-expanded="false">Exportar ▾</button>
      <div id="exportMenu" role="menu">
        <button id="exportWeb" role="menuitem">Exportar web · HTML</button>
        <button id="exportZip" role="menuitem">Exportar proyecto · ZIP</button>
      </div>
    </div>
  </div>
</header>

<main id="workspace">
  <section class="pane" id="editorPane">
    <div class="pane-head">
      <div class="file-head-left">
        <button id="toggleExplorer" title="Mostrar archivos">›</button>
        <span id="activeFileName">index.rc</span>
      </div>
      <span class="status" id="saveStatus">Guardado automático</span>
    </div>
    <div class="editor-workspace">
      <aside id="explorer">
        <div class="explorer-title">ARCHIVOS</div>
        <div class="explorer-actions">
          <button id="newRcFile">+ RC</button>
          <button id="newAssetFile">+ Archivo</button>
        </div>
        <div id="fileList"></div>
      </aside>
      <div class="code-container">
        <div id="lineNumbers">1</div>
        <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Escribe tu código RC aquí..."></textarea>
      </div>
    </div>
  </section>
  <div id="splitter"></div>
  <section class="pane" id="previewPane">
    <div class="pane-head">
      <span>VISTA PREVIA</span>
      <span class="status" id="previewStatus">Actualización automática</span>
    </div>
    <iframe id="preview" title="Vista previa" sandbox="allow-scripts allow-forms allow-popups"></iframe>
  </section>
</main>
<div id="toast"></div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const DB_KEY = "rc_studio_v40_project";
const editor = $("editor");
const lineNumbers = $("lineNumbers");
const preview = $("preview");
const explorer = $("explorer");
const fileList = $("fileList");
const saveStatus = $("saveStatus");
const previewStatus = $("previewStatus");
const exportMenu = $("exportMenu");
let timer = null;
let toastTimer = null;
let project;
let activeId = "main";

function uid() {
  return "f_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
}
function toast(message) {
  $("toast").textContent = message;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2400);
}
function validFilename(name) {
  return !!name && /^[a-zA-Z0-9 _.-]+$/.test(name) && !name.startsWith(".") && !name.includes("..");
}
function activeFile() {
  return project.files.find(f => f.id === activeId) || project.files[0];
}
function ensureMainFile() {
  if (!project.files.length) {
    project.files.push({id:"main",name:"index.rc",content:"",type:"rc"});
  }
  if (!project.files.some(f => f.id === activeId)) {
    activeId = project.files[0].id;
  }
}

function updateLineNumbers() {
  const lines = editor.value.split("\n").length;
  let text = "";
  for (let i = 1; i <= lines; i++) {
    text += i + "\n";
  }
  lineNumbers.textContent = text;
}

editor.addEventListener("scroll", () => {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + "    " + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 4;
    updateLineNumbers();
    scheduleUpdate();
  }
});

function defaultProject() {
  return {
    version: 4.0,
    files: [{
      id: "main",
      name: "index.rc",
      content: `// app rc studio 4.0 - interprete universal rc
titulo(mi aplicacion rc)
fondo(101012)
color(f4f4f5)

contenedor(app)
ancho(380)
centrar
radio(16)

pagina(paginicio)
encabezado(2)(demostración rc multipágina)
linea
texto(el lenguaje rc procesa navegacion condicionales listas y memoria)
rejilla(2)
boton(btnircalc)(calculadora)
boton(btnirtareas)(tareas)

irapagina(btnircalc)(pagcalc)
irapagina(btnirtareas)(pagtareas)

pagina(pagcalc)
encabezado(2)(calculadora rc)
linea
etiquetacampo(numero 1)
camponumero(num1)(10)
etiquetacampo(numero 2)
camponumero(num2)(5)
rejilla(2)
boton(btnsumar)(+)
boton(btnrestar)(-)
etiqueta(lblres)(resultado: 15)

sumar(btnsumar)(num1)(num2)(lblres)
restar(btnrestar)(num1)(num2)(lblres)

boton(btnvolver1)(volver al inicio)
irapagina(btnvolver1)(paginicio)

pagina(pagtareas)
encabezado(2)(lista de tareas)
linea
etiquetacampo(nueva tarea)
entrada(inptarea)(estudiar rc)
boton(btnagregar)(agregar tarea)
listadesordenada(milista)

agregaralasta(btnagregar)(inptarea)(milista)

boton(btnvolver2)(volver al inicio)
irapagina(btnvolver2)(paginicio)`,
      type: "rc"
    }]
  };
}

function loadProject() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return defaultProject();
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.files)) return defaultProject();
    return parsed;
  } catch {
    return defaultProject();
  }
}
project = loadProject();
ensureMainFile();

function saveProject() {
  const file = activeFile();
  if (file) file.content = editor.value;
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(project));
    saveStatus.textContent = "Guardado automático";
  } catch {
    saveStatus.textContent = "Error al guardar";
  }
}

function switchFile(id) {
  saveProject();
  const file = project.files.find(f => f.id === id);
  if (!file) return;
  activeId = id;
  editor.value = file.content;
  $("activeFileName").textContent = file.name;
  updateLineNumbers();
  renderFileList();
  scheduleUpdate();
}

function renderFileList() {
  fileList.replaceChildren();
  for (const file of project.files) {
    const row = document.createElement("div");
    row.className = "file-item";
    const select = document.createElement("button");
    select.className = "file-select" + (file.id === activeId ? " file-selected" : "");
    select.textContent = (file.type === "rc" ? "◇ " : "▤ ") + file.name;
    select.addEventListener("click", () => switchFile(file.id));

    const tools = document.createElement("div");
    tools.className = "file-tools";
    const rename = document.createElement("button");
    rename.textContent = "✎";
    rename.addEventListener("click", () => renameFile(file));
    const remove = document.createElement("button");
    remove.textContent = "×";
    remove.addEventListener("click", () => deleteFile(file));
    tools.append(rename, remove);
    row.append(select, tools);
    fileList.append(row);
  }
}

function createFile(type) {
  const name = prompt(type === "rc" ? "Nombre del archivo RC:" : "Nombre del archivo:");
  if (name === null) return;
  let clean = name.trim().toLowerCase();
  if (type === "rc" && !clean.endsWith(".rc")) clean += ".rc";
  if (!validFilename(clean)) return toast("Nombre no válido.");
  if (project.files.some(f => f.name.toLowerCase() === clean)) return toast("Ya existe este archivo.");
  const file = {id:uid(), name:clean, content:"", type: clean.endsWith(".rc")?"rc":"asset"};
  project.files.push(file);
  saveProject();
  switchFile(file.id);
}

function renameFile(file) {
  const name = prompt("Nuevo nombre:", file.name);
  if (name === null) return;
  let clean = name.trim().toLowerCase();
  if (file.type === "rc" && !clean.endsWith(".rc")) clean += ".rc";
  if (!validFilename(clean)) return toast("Nombre no válido.");
  file.name = clean;
  saveProject();
  renderFileList();
  scheduleUpdate();
}

function deleteFile(file) {
  if (!confirm("¿Eliminar " + file.name + "?")) return;
  if (project.files.length === 1) return toast("Debes conservar al menos un archivo.");
  project.files = project.files.filter(f => f.id !== file.id);
  switchFile(project.files[0].id);
}

function esc(val) {
  return String(val).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}

function parseLine(line) {
  const match = line.match(/^\s*([a-zA-Z0-9]+)/);
  if (!match) return null;
  const name = match[1];
  
  if (name !== name.toLowerCase()) {
    return { name, args: [], isError: true, errorMsg: `El comando "${name}" debe escribirse en minúsculas strictly.` };
  }

  let i = match[0].length;
  const args = [];
  while (i < line.length) {
    while (i < line.length && /\s/.test(line[i])) i++;
    if (i >= line.length) break;
    if (line[i] !== "(") return null;
    i++;
    const start = i;
    let depth = 1;
    while (i < line.length && depth) {
      if (line[i] === "(") depth++;
      if (line[i] === ")") depth--;
      i++;
    }
    if (depth) return null;
    args.push(line.slice(start, i - 1).trim());
  }
  return {name, args, isError: false};
}

function parseColor(c) {
  if (!c) return "inherit";
  const clean = c.trim();
  if (/^[0-9a-fA-F]{3,8}$/.test(clean)) return "#" + clean;
  return clean;
}

function compileProject(files) {
  const html = [];
  const actions = [];
  const errors = [];
  const ids = new Set();
  const includedSet = new Set();
  let pageOpen = false;

  let title = "Mi Aplicación RC";
  let bg = "#101012";
  let fg = "#f4f4f5";
  let font = "system-ui, sans-serif";
  let size = "16px";

  function arity(cmd, n, line, fileName) {
    if (cmd.args.length !== n) {
      errors.push(`[${fileName}] Línea ${line}: ${cmd.name} necesita ${n} argumento(s).`);
      return false;
    }
    return true;
  }

  function addId(id, line, fileName) {
    if (!/^[a-z0-9]+$/.test(id)) {
      errors.push(`[${fileName}] Línea ${line}: ID no válido: ${id}`);
      return false;
    }
    if (ids.has(id)) {
      errors.push(`[${fileName}] Línea ${line}: ID duplicado: ${id}`);
      return false;
    }
    ids.add(id);
    return true;
  }

  function processFile(fileName) {
    let cleanName = fileName.toLowerCase().trim();
    if (!cleanName.endsWith(".rc")) cleanName += ".rc";

    if (includedSet.has(cleanName)) return;
    includedSet.add(cleanName);

    const fileObj = files.find(f => f.name.toLowerCase() === cleanName);
    if (!fileObj) {
      errors.push(`Error de inclusión: El archivo "${fileName}" no existe.`);
      return;
    }

    fileObj.content.split(/\r?\n/).forEach((raw, index) => {
      const line = index + 1;
      let cleanLine = raw;
      
      const commentIdx = cleanLine.indexOf("//");
      if (commentIdx !== -1) cleanLine = cleanLine.slice(0, commentIdx);
      if (!cleanLine.trim()) return;

      const c = parseLine(cleanLine);
      if (!c) {
        errors.push(`[${cleanName}] Línea ${line}: sintaxis de paréntesis o estructura no válida.`);
        return;
      }
      if (c.isError) {
        errors.push(`[${cleanName}] Línea ${line}: ${c.errorMsg}`);
        return;
      }

      const a = c.args;

      switch (c.name) {
        // ESTRUCTURA, PÁGINAS Y MÓDULOS
        case "titulo": if (arity(c,1,line,cleanName)) title = a[0]; break;
        case "fondo": if (arity(c,1,line,cleanName)) bg = parseColor(a[0]); break;
        case "color": if (arity(c,1,line,cleanName)) fg = parseColor(a[0]); break;
        case "letra": if (arity(c,1,line,cleanName)) font = a[0]; break;
        case "tamano": if (arity(c,1,line,cleanName)) size = /^\d+$/.test(a[0]) ? a[0]+"px" : a[0]; break;
        case "incluir": if (arity(c,1,line,cleanName)) processFile(a[0]); break;

        case "pagina":
          if (arity(c,1,line,cleanName) && addId(a[0],line,cleanName)) {
            if (pageOpen) html.push("</div>");
            pageOpen = true;
            html.push(`<div class="rc-page" id="${esc(a[0])}">`);
          }
          break;
        case "contenedor":
        case "seccion":
          if (arity(c,1,line,cleanName) && addId(a[0],line,cleanName)) {
            html.push(`<div class="rc-card" id="${esc(a[0])}"><p class="rc-card-title">${esc(a[0])}</p>`);
          }
          break;
        case "linea": if (arity(c,0,line,cleanName)) html.push("<hr>"); break;

        // DISEÑO Y ESTILOS VISUALES
        case "ancho":
          if (arity(c,1,line,cleanName)) html.push(`<style>#${ids.size ? Array.from(ids).pop() : 'app'}{max-width:${esc(a[0])}px;width:100%}</style>`);
          break;
        case "alto":
          if (arity(c,1,line,cleanName)) html.push(`<style>#${ids.size ? Array.from(ids).pop() : 'app'}{max-height:${esc(a[0])}px;height:100%}</style>`);
          break;
        case "radio":
          if (arity(c,1,line,cleanName)) html.push(`<style>.rc-card, button, input, textarea, canvas{border-radius:${esc(a[0])}px !important}</style>`);
          break;
        case "centrar":
          if (arity(c,0,line,cleanName)) html.push(`<style>body{align-items:center} .rc-card{margin:0 auto}</style>`);
          break;
        case "rejilla":
          if (arity(c,1,line,cleanName)) html.push(`<div style="display:grid;grid-template-columns:repeat(${esc(a[0])}, 1fr);gap:8px;margin:8px 0">`);
          break;
        case "gap":
          if (arity(c,1,line,cleanName)) html.push(`<style>div[style*="grid"]{gap:${esc(a[0])}px !important}</style>`);
          break;
        case "ocultar":
          if (arity(c,1,line,cleanName)) html.push(`<style>#${esc(a[0])}{display:none !important}</style>`);
          break;
        case "mostrar":
          if (arity(c,1,line,cleanName)) html.push(`<style>#${esc(a[0])}{display:block !important}</style>`);
          break;

        // TEXTO Y CONTENIDO
        case "texto":
        case "parrafo": if (arity(c,1,line,cleanName)) html.push("<p>"+esc(a[0])+"</p>"); break;
        case "negrita": if (arity(c,1,line,cleanName)) html.push("<strong>"+esc(a[0])+"</strong>"); break;
        case "cursiva": if (arity(c,1,line,cleanName)) html.push("<em>"+esc(a[0])+"</em>"); break;
        case "subrayado": if (arity(c,1,line,cleanName)) html.push("<u>"+esc(a[0])+"</u>"); break;
        case "bloque": if (arity(c,1,line,cleanName)) html.push("<div>"+esc(a[0])+"</div>"); break;
        case "cita": if (arity(c,1,line,cleanName)) html.push("<blockquote>"+esc(a[0])+"</blockquote>"); break;
        case "codigo": if (arity(c,1,line,cleanName)) html.push("<code>"+esc(a[0])+"</code>"); break;
        case "enlace":
          if (arity(c,2,line,cleanName)) html.push(`<a href="${esc(a[0])}" target="_blank" style="color:var(--accent,#f97316);text-decoration:underline;">${esc(a[1])}</a>`);
          break;
        case "imagen":
          if (arity(c,1,line,cleanName)) html.push(`<img src="${esc(a[0])}" style="max-width:100%;height:auto;border-radius:8px;" alt="imagen">`);
          break;
        case "encabezado":
          if (arity(c,2,line,cleanName)) html.push(`<h${esc(a[0])}>${esc(a[1])}</h${esc(a[0])}>`);
          break;

        // LISTAS Y TABLAS
        case "listadesordenada":
          if (a.length === 0) html.push("<ul>");
          else if (a.length === 1 && addId(a[0],line,cleanName)) html.push(`<ul id="${esc(a[0])}">`);
          else arity(c,0,line,cleanName);
          break;
        case "listaordenada":
          if (a.length === 0) html.push("<ol>");
          else if (a.length === 1 && addId(a[0],line,cleanName)) html.push(`<ol id="${esc(a[0])}">`);
          else arity(c,0,line,cleanName);
          break;
        case "elementolista": if (arity(c,1,line,cleanName)) html.push("<li>"+esc(a[0])+"</li>"); break;
        case "tabla": if (arity(c,0,line,cleanName)) html.push('<table style="width:100%;border-collapse:collapse;margin:8px 0;">'); break;
        case "filatabla": if (arity(c,0,line,cleanName)) html.push("<tr>"); break;
        case "encabezadotabla": if (arity(c,1,line,cleanName)) html.push(`<th style="border:1px solid rgba(255,255,255,0.2);padding:8px;text-align:left;">${esc(a[0])}</th>`); break;
        case "celdatabla": if (arity(c,1,line,cleanName)) html.push(`<td style="border:1px solid rgba(255,255,255,0.2);padding:8px;">${esc(a[0])}</td>`); break;

        // COMPONENTES DE INTERFAZ Y FORMULARIOS
        case "boton":
          if (arity(c,2,line,cleanName) && addId(a[0],line,cleanName))
            html.push(`<button id="${esc(a[0])}">${esc(a[1])}</button>`);
          break;
        case "etiqueta":
          if (arity(c,2,line,cleanName) && addId(a[0],line,cleanName))
            html.push(`<div class="rc-label"><span id="${esc(a[0])}">${esc(a[1])}</span></div>`);
          break;
        case "etiquetacampo":
          if (arity(c,1,line,cleanName)) html.push(`<label class="rc-field-lbl">${esc(a[0])}</label>`);
          break;
        case "cargando":
          if (arity(c,0,line,cleanName)) html.push('<div class="rc-loading" style="display:inline-flex;align-items:center;gap:8px;padding:8px 12px;opacity:0.85;"><span style="animation:spin 1s linear infinite;display:inline-block;">⏳</span> Cargando...</div>');
          break;
        case "entrada":
          if (arity(c,2,line,cleanName) && addId(a[0],line,cleanName))
            html.push(`<input type="text" id="${esc(a[0])}" value="${esc(a[1])}">`);
          break;
        case "camponumero":
          if (arity(c,2,line,cleanName) && addId(a[0],line,cleanName))
            html.push(`<input type="number" id="${esc(a[0])}" value="${esc(a[1])}">`);
          break;
        case "campocorreo":
          if (arity(c,2,line,cleanName) && addId(a[0],line,cleanName))
            html.push(`<input type="email" id="${esc(a[0])}" value="${esc(a[1])}">`);
          break;
        case "campocontrasena":
          if ((a.length === 1 || a.length === 2) && addId(a[0],line,cleanName)) {
            html.push(`<input type="password" id="${esc(a[0])}" value="${esc(a[1]||'')}">`);
          } else {
            arity(c,1,line,cleanName);
          }
          break;
        case "areatexto":
          if ((a.length === 1 || a.length === 2) && addId(a[0],line,cleanName)) {
            html.push(`<textarea id="${esc(a[0])}">${esc(a[1]||'')}</textarea>`);
          } else {
            arity(c,2,line,cleanName);
          }
          break;
        case "lienzo":
          if (arity(c,1,line,cleanName) && addId(a[0],line,cleanName))
            html.push(`<canvas id="${esc(a[0])}" width="280" height="260" style="background:#ffffff;display:block;margin:0 auto;cursor:crosshair;touch-action:none;border-radius:8px;border:1px solid rgba(255,255,255,0.2)"></canvas>`);
          break;

        // EVENTOS, NAVEGACIÓN Y CONDICIONALES
        case "irapagina": if (arity(c,2,line,cleanName)) actions.push({type:"irapagina",b:a[0],page:a[1]}); break;
        case "limpiar": if (arity(c,2,line,cleanName)) actions.push({type:"limpiar",b:a[0],t:a[1]}); break;
        case "avisar": if (arity(c,2,line,cleanName)) actions.push({type:"avisar",b:a[0],m:a[1]}); break;
        case "ira": if (arity(c,2,line,cleanName)) actions.push({type:"ira",b:a[0],url:a[1]}); break;
        case "ocultarboton": if (arity(c,2,line,cleanName)) actions.push({type:"ocultarboton",b:a[0],target:a[1]}); break;
        case "mostrarboton": if (arity(c,2,line,cleanName)) actions.push({type:"mostrarboton",b:a[0],target:a[1]}); break;
        case "alternar": if (arity(c,2,line,cleanName)) actions.push({type:"alternar",b:a[0],target:a[1]}); break;
        case "limpiarlienzo": if (arity(c,2,line,cleanName)) actions.push({type:"limpiarlienzo",b:a[0],canvas:a[1]}); break;

        case "agregaralasta": if (arity(c,3,line,cleanName)) actions.push({type:"agregaralasta",b:a[0],in1:a[1],list:a[2]}); break;
        case "guardar": if (arity(c,3,line,cleanName)) actions.push({type:"guardar",b:a[0],in1:a[1],key:a[2]}); break;
        case "cargar": if (arity(c,3,line,cleanName)) actions.push({type:"cargar",b:a[0],key:a[1],lbl:a[2]}); break;

        case "siesigual": if (arity(c,4,line,cleanName)) actions.push({type:"siesigual",b:a[0],in1:a[1],in2:a[2],target:a[3]}); break;
        case "siesmayor": if (arity(c,4,line,cleanName)) actions.push({type:"siesmayor",b:a[0],in1:a[1],in2:a[2],target:a[3]}); break;
        case "siestavacio": if (arity(c,3,line,cleanName)) actions.push({type:"siestavacio",b:a[0],in1:a[1],target:a[2]}); break;

        case "sumar": if (arity(c,4,line,cleanName)) actions.push({type:"sumar",b:a[0],in1:a[1],in2:a[2],lbl:a[3]}); break;
        case "restar": if (arity(c,4,line,cleanName)) actions.push({type:"restar",b:a[0],in1:a[1],in2:a[2],lbl:a[3]}); break;
        case "multiplicar": if (arity(c,4,line,cleanName)) actions.push({type:"multiplicar",b:a[0],in1:a[1],in2:a[2],lbl:a[3]}); break;
        case "dividir": if (arity(c,4,line,cleanName)) actions.push({type:"dividir",b:a[0],in1:a[1],in2:a[2],lbl:a[3]}); break;

        // INTÉRPRETE UNIVERSAL DINÁMICO (COMANDOS INVENTADOS)
        default:
          if (a.length === 0) {
            html.push(`<div class="rc-custom rc-${esc(c.name)}"><span class="rc-tag">[${esc(c.name)}]</span></div>`);
          } else if (a.length === 1) {
            html.push(`<div class="rc-custom rc-${esc(c.name)}"><span class="rc-tag">[${esc(c.name)}]</span> ${esc(a[0])}</div>`);
          } else {
            if (/^[a-z0-9]+$/.test(a[0]) && addId(a[0], line, cleanName)) {
              html.push(`<div class="rc-custom rc-${esc(c.name)}" id="${esc(a[0])}"><span class="rc-tag">[${esc(c.name)}]</span> ${a.slice(1).map(esc).join(" - ")}</div>`);
            } else {
              html.push(`<div class="rc-custom rc-${esc(c.name)}"><span class="rc-tag">[${esc(c.name)}]</span> ${a.map(esc).join(" - ")}</div>`);
            }
          }
      }
    });

    if (pageOpen) {
      html.push("</div>");
      pageOpen = false;
    }
  }

  const mainFile = files.find(f => f.name.toLowerCase() === "index.rc") || files[0];
  if (mainFile) processFile(mainFile.name);

  const actionCode = actions.map(a => {
    const b = JSON.stringify(a.b);
    if (a.type === "irapagina") {
      return `document.getElementById(${b})?.addEventListener("click",()=>{document.querySelectorAll('.rc-page').forEach(p=>p.style.display='none');const target=document.getElementById(${JSON.stringify(a.page)});if(target)target.style.display='flex';});`;
    }
    if (a.type === "avisar") return `document.getElementById(${b})?.addEventListener("click",()=>alert(${JSON.stringify(a.m)}));`;
    if (a.type === "ira") return `document.getElementById(${b})?.addEventListener("click",()=>window.open(${JSON.stringify(a.url)},"_blank"));`;
    if (a.type === "limpiar") return `document.getElementById(${b})?.addEventListener("click",()=>{const t=document.getElementById(${JSON.stringify(a.t)});if(t){if("value" in t)t.value="";else t.textContent="";}});`;
    if (a.type === "limpiarlienzo") return `document.getElementById(${b})?.addEventListener("click",()=>{const cv=document.getElementById(${JSON.stringify(a.canvas)});if(cv){const ctx=cv.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);}});`;
    if (a.type === "ocultarboton") return `document.getElementById(${b})?.addEventListener("click",()=>{const el=document.getElementById(${JSON.stringify(a.target)});if(el)el.style.display="none";});`;
    if (a.type === "mostrarboton") return `document.getElementById(${b})?.addEventListener("click",()=>{const el=document.getElementById(${JSON.stringify(a.target)});if(el)el.style.display="";});`;
    if (a.type === "alternar") return `document.getElementById(${b})?.addEventListener("click",()=>{const el=document.getElementById(${JSON.stringify(a.target)});if(el){const cur=getComputedStyle(el).display;el.style.display=(cur==="none")?"":"none";}});`;

    if (a.type === "agregaralasta") {
      return `document.getElementById(${b})?.addEventListener("click",()=>{const inp=document.getElementById(${JSON.stringify(a.in1)});const lst=document.getElementById(${JSON.stringify(a.list)});if(inp&&lst&&inp.value.trim()){const li=document.createElement("li");li.textContent=inp.value.trim();lst.appendChild(li);inp.value="";}});`;
    }
    if (a.type === "guardar") {
      return `document.getElementById(${b})?.addEventListener("click",()=>{const val=(document.getElementById(${JSON.stringify(a.in1)})?.value||document.getElementById(${JSON.stringify(a.in1)})?.textContent||"").trim();localStorage.setItem(${JSON.stringify(a.key)},val);alert("Guardado en memoria");});`;
    }
    if (a.type === "cargar") {
      return `document.getElementById(${b})?.addEventListener("click",()=>{const val=localStorage.getItem(${JSON.stringify(a.key)})||"";const target=document.getElementById(${JSON.stringify(a.lbl)});if(target){if("value" in target&&(target.tagName==="INPUT"||target.tagName==="TEXTAREA"))target.value=val;else target.textContent=val;}});`;
    }

    if (a.type === "siesigual") {
      return `document.getElementById(${b})?.addEventListener("click",()=>{const v1=(document.getElementById(${JSON.stringify(a.in1)})?.value||document.getElementById(${JSON.stringify(a.in1)})?.textContent||"").trim();const v2=(document.getElementById(${JSON.stringify(a.in2)})?.value||document.getElementById(${JSON.stringify(a.in2)})?.textContent||"").trim();const el=document.getElementById(${JSON.stringify(a.target)});if(el)el.style.display=(v1===v2)?"block":"none";});`;
    }
    if (a.type === "siesmayor") {
      return `document.getElementById(${b})?.addEventListener("click",()=>{const v1=parseFloat(document.getElementById(${JSON.stringify(a.in1)})?.value||document.getElementById(${JSON.stringify(a.in1)})?.textContent||0)||0;const v2=parseFloat(document.getElementById(${JSON.stringify(a.in2)})?.value||document.getElementById(${JSON.stringify(a.in2)})?.textContent||0)||0;const el=document.getElementById(${JSON.stringify(a.target)});if(el)el.style.display=(v1>v2)?"block":"none";});`;
    }
    if (a.type === "siestavacio") {
      return `document.getElementById(${b})?.addEventListener("click",()=>{const v=(document.getElementById(${JSON.stringify(a.in1)})?.value||document.getElementById(${JSON.stringify(a.in1)})?.textContent||"").trim();const el=document.getElementById(${JSON.stringify(a.target)});if(el)el.style.display=(v==="")?"block":"none";});`;
    }

    if (a.type === "sumar" || a.type === "restar" || a.type === "multiplicar" || a.type === "dividir") {
      return `document.getElementById(${b})?.addEventListener("click",()=>{
        const e1=document.getElementById(${JSON.stringify(a.in1)});
        const e2=document.getElementById(${JSON.stringify(a.in2)});
        const lbl=document.getElementById(${JSON.stringify(a.lbl)});
        const v1=parseFloat(e1?.value||e1?.textContent||0)||0;
        const v2=parseFloat(e2?.value||e2?.textContent||0)||0;
        let res=0;
        if("${a.type}"==="sumar") res=v1+v2;
        if("${a.type}"==="restar") res=v1-v2;
        if("${a.type}"==="multiplicar") res=v1*v2;
        if("${a.type}"==="dividir") res=(v2!==0)?(v1/v2):"Error div 0";
        if(lbl){
          if("value" in lbl && (lbl.tagName==="INPUT"||lbl.tagName==="TEXTAREA")) lbl.value=res;
          else lbl.textContent=res;
        }
      });`;
    }
    return "";
  }).join("\n");

  const drawingEngineJS = `
    document.querySelectorAll('canvas').forEach(cv => {
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      let drawing = false;

      function getPos(e) {
        const rect = cv.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (cv.width / rect.width),
          y: (clientY - rect.top) * (cv.height / rect.height)
        };
      }

      function startDraw(e) {
        drawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        e.preventDefault();
      }

      function draw(e) {
        if (!drawing) return;
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        e.preventDefault();
      }

      function stopDraw() {
        drawing = false;
      }

      cv.addEventListener('mousedown', startDraw);
      cv.addEventListener('mousemove', draw);
      window.addEventListener('mouseup', stopDraw);

      cv.addEventListener('touchstart', startDraw, {passive: false});
      cv.addEventListener('touchmove', draw, {passive: false});
      window.addEventListener('touchend', stopDraw);
    });
  `;

  const errorHTML = errors.length
    ? '<div style="padding:12px;margin:12px 0;border:1px solid #ef4444;color:#f87171;background:#271212;border-radius:8px"><b>Errores de sintaxis:</b><ul>'+
      errors.map(e=>"<li>"+esc(e)+"</li>").join("")+"</ul></div>"
    : "";

  const documentHTML = `<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(title)}</title><style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px; background: ${esc(bg)}; color: ${esc(fg)};
  font-family: ${esc(font)}; font-size: ${esc(size)};
  display: flex; flex-direction: column; gap: 10px;
}
.rc-page { display: none; width: 100%; flex-direction: column; gap: 10px; }
.rc-page:first-of-type { display: flex; }
p, h1, h2, h3, h4, h5, h6 { margin: 6px 0; }
hr { border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 12px 0; width: 100%; }
.rc-card {
  border: 1px solid rgba(255,255,255,0.15); padding: 16px; margin: 8px 0;
  border-radius: 12px; background: rgba(255,255,255,0.03);
  display: flex; flex-direction: column; gap: 8px;
}
.rc-card-title { font-weight: bold; margin-bottom: 4px; opacity: 0.8; text-transform: uppercase; font-size: 12px; }
.rc-field-lbl { font-size: 13px; opacity: 0.8; display: block; margin-top: 4px; }
.rc-label { font-size: 18px; font-weight: bold; padding: 8px 0; }
input, textarea {
  width: 100%; font: inherit; padding: 10px 14px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: inherit; outline: none;
}
button {
  font: inherit; padding: 10px 16px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.12); color: inherit;
  cursor: pointer; transition: background 0.2s;
  width: 100%;
}
button:hover { background: rgba(255,255,255,0.22); }
ul, ol { margin: 6px 0; padding-left: 24px; }
li { margin: 4px 0; }
table { width: 100%; border-collapse: collapse; margin: 8px 0; }
th, td { border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; text-align: left; }
th { background: rgba(255,255,255,0.1); }
blockquote { border-left: 3px solid var(--accent, #f97316); margin: 8px 0; padding: 6px 16px; background: rgba(255,255,255,0.02); }
code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
.rc-custom {
  border: 1px dashed rgba(255,255,255,0.25);
  padding: 8px 12px;
  margin: 6px 0;
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
}
.rc-tag {
  font-weight: bold;
  color: #f97316;
  font-size: 0.85em;
  margin-right: 6px;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
</style></head><body>
${html.join("\n")}
${errorHTML}
<script>
try {
  ${actionCode}
  ${drawingEngineJS}
} catch(e) { console.error(e); }
<\/script></body></html>`;

  return {html:documentHTML, errors};
}

function buildPage() {
  const currentFiles = project.files.map(f => ({
    name: f.name,
    content: f.id === activeId ? editor.value : f.content
  }));
  return compileProject(currentFiles);
}

function update() {
  saveProject();
  const result = buildPage();
  preview.srcdoc = result.html;
  previewStatus.textContent = result.errors.length ? result.errors.length+" error(es)" : "Vista previa lista";
}

function scheduleUpdate() {
  saveStatus.textContent = "Guardando...";
  previewStatus.textContent = "Actualizando...";
  clearTimeout(timer);
  timer = setTimeout(update, 250);
}

editor.addEventListener("input", () => {
  updateLineNumbers();
  scheduleUpdate();
});

$("newRcFile").addEventListener("click",()=>createFile("rc"));
$("newAssetFile").addEventListener("click",()=>createFile("asset"));

function setExplorerOpen(open) {
  explorer.classList.toggle("open", open);
  $("toggleExplorer").textContent = open ? "‹" : "›";
}
$("toggleExplorer").addEventListener("click", () => setExplorerOpen(!explorer.classList.contains("open")));

$("clearBtn").addEventListener("click",()=>{
  if(!confirm("¿Borrar el contenido?")) return;
  editor.value="";
  updateLineNumbers();
  scheduleUpdate();
});

$("exportBtn").addEventListener("click", e => {
  e.stopPropagation();
  exportMenu.classList.toggle("open");
});
document.addEventListener("click", () => exportMenu.classList.remove("open"));

function download(name,content,type) {
  const blob = new Blob([content],{type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

$("exportWeb").addEventListener("click",()=>{
  update();
  download("index.html",buildPage().html,"text/html;charset=utf-8");
});

function createZipBuffer(files) {
  const crcTable = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) {
      c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    }
    crcTable[i] = c;
  }
  function getCrc32(bytes) {
    let crc = -1;
    for (let i = 0; i < bytes.length; i++) {
      crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xff];
    }
    return (crc ^ -1) >>> 0;
  }

  const encoder = new TextEncoder();
  const fileEntries = [];
  let offset = 0;

  for (const file of files) {
    const fileNameBytes = encoder.encode(file.name);
    const fileData = typeof file.content === "string" ? encoder.encode(file.content) : file.content;
    const crc = getCrc32(fileData);
    const size = fileData.length;

    const header = new Uint8Array(30 + fileNameBytes.length + size);
    const view = new DataView(header.buffer);
    view.setUint32(0, 0x04034b50, true);
    view.setUint16(4, 20, true);
    view.setUint16(6, 0, true);
    view.setUint16(8, 0, true);
    view.setUint16(10, 0, true);
    view.setUint16(12, 0, true);
    view.setUint32(14, crc, true);
    view.setUint32(18, size, true);
    view.setUint32(22, size, true);
    view.setUint16(26, fileNameBytes.length, true);
    view.setUint16(28, 0, true);
    header.set(fileNameBytes, 30);
    header.set(fileData, 30 + fileNameBytes.length);

    fileEntries.push({
      file,
      fileNameBytes,
      crc,
      size,
      offset,
      header
    });

    offset += header.length;
  }

  const centralDirOffset = offset;
  let centralDirSize = 0;
  const centralHeaders = [];

  for (const entry of fileEntries) {
    const cdHeader = new Uint8Array(46 + entry.fileNameBytes.length);
    const view = new DataView(cdHeader.buffer);
    view.setUint32(0, 0x02014b50, true);
    view.setUint16(4, 20, true);
    view.setUint16(6, 20, true);
    view.setUint16(8, 0, true);
    view.setUint16(10, 0, true);
    view.setUint16(12, 0, true);
    view.setUint16(14, 0, true);
    view.setUint32(16, entry.crc, true);
    view.setUint32(20, entry.size, true);
    view.setUint32(24, entry.size, true);
    view.setUint16(28, entry.fileNameBytes.length, true);
    view.setUint16(30, 0, true);
    view.setUint16(32, 0, true);
    view.setUint16(34, 0, true);
    view.setUint16(36, 0, true);
    view.setUint32(38, 0, true);
    view.setUint32(42, entry.offset, true);
    cdHeader.set(entry.fileNameBytes, 46);

    centralHeaders.push(cdHeader);
    centralDirSize += cdHeader.length;
  }

  const eocd = new Uint8Array(22);
  const viewEocd = new DataView(eocd.buffer);
  viewEocd.setUint32(0, 0x06054b50, true);
  viewEocd.setUint16(4, 0, true);
  viewEocd.setUint16(6, 0, true);
  viewEocd.setUint16(8, fileEntries.length, true);
  viewEocd.setUint16(10, fileEntries.length, true);
  viewEocd.setUint32(12, centralDirSize, true);
  viewEocd.setUint32(16, centralDirOffset, true);
  viewEocd.setUint16(20, 0, true);

  const totalSize = centralDirOffset + centralDirSize + 22;
  const zipBuffer = new Uint8Array(totalSize);
  let pos = 0;
  for (const entry of fileEntries) {
    zipBuffer.set(entry.header, pos);
    pos += entry.header.length;
  }
  for (const cdH of centralHeaders) {
    zipBuffer.set(cdH, pos);
    pos += cdH.length;
  }
  zipBuffer.set(eocd, pos);

  return zipBuffer;
}

$("exportZip").addEventListener("click", () => {
  update();
  const compiled = buildPage();
  const filesToZip = project.files.map(f => ({
    name: f.name,
    content: f.id === activeId ? editor.value : f.content
  }));
  filesToZip.push({ name: "index.html", content: compiled.html });
  const zipBuffer = createZipBuffer(filesToZip);
  const blob = new Blob([zipBuffer], { type: "application/zip" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "proyecto_rc.zip";
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
});

ensureMainFile();
const initial=activeFile();
editor.value=initial.content;
$("activeFileName").textContent=initial.name;
updateLineNumbers();
renderFileList();
update();
})();
